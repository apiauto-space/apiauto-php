name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: curl
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: composer install --no-interaction --no-progress
      - name: Syntax
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
      - name: Tag matches Client::VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oP "const VERSION = '\K[^']+" src/Client.php)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != version $version"; exit 1; }

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
